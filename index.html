        }

        }
        
        .hero p {

        }
        
        .search-container {

            margin: 0 auto 40px;
        }
        
        .search-input {

        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        
        .account-card {

            border: 1px solid #E5E5EA;

            transition: all 0.2s;
            cursor: pointer;

            align-items: center;

            align-items: center;

            color: #1C1C1E;

            color: #8A8A8E;

        .account-stats {

            margin-bottom: 16px;

        .stat {

            flex-direction: column;
            align-items: center;

        .stat-value {

            font-weight: 600;

            {
                id: '9',
                username: 'paulg',
                displayName: 'Paul Graham',
                bio: 'Y Combinator联合创始人',
                category: '创业投资',
                tags: ['创业', '投资', '编程'],

                description: 'Y Combinator联合创始人，知名创业导师和投资人。其关于创业、编程和人生的文章深受创业者喜爱，是硅谷重要的思想领袖。',
                verified: true

        let currentCategory = '全部';
        let currentSearch = '';

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        function renderAccountCard(account) {
            return '<div class="account-card" onclick="followAccount(\'' + account.id + '\')">' +
                '<div class="account-header">' +
                    '<div class="account-avatar">' + account.displayName.charAt(0) + '</div>' +
                    '<div class="account-info">' +
                        '<h3>@' + account.username + (account.verified ? ' <span class="verified">✓</span>' : '') + '</h3>' +
                        '<p>' + account.bio + '</p>' +
                    '</div>' +
                '</div>' +
                '<div class="account-description">' + account.description + '</div>' +
                '<div class="account-tags">' +
                    account.tags.slice(0, 3).map(function(tag) {
                        return '<span class="tag">' + tag + '</span>';
                    }).join('') +
                '</div>' +
                '<div class="account-stats">' +
                    '<div class="stat">' +
                        '<div class="stat-value">' + formatNumber(account.followers) + '</div>' +
                        '<div class="stat-label">关注者</div>' +
                    '</div>' +
                    '<div class="stat">' +
                        '<div class="stat-value">' + formatNumber(account.tweets) + '</div>' +
                        '<div class="stat-label">推文</div>' +
                    '</div>' +
                    '<div class="stat">' +
                        '<div class="stat-value">' + account.activity + '%</div>' +
                        '<div class="stat-label">活跃度</div>' +
                    '</div>' +
                '</div>' +
                '<button class="follow-btn">关注账号</button>' +
            '</div>';
        }

        function filterAccounts() {
            var filtered = accounts;

            if (currentCategory !== '全部') {
                filtered = filtered.filter(function(account) {
                    return account.category.includes(currentCategory) || 
                           account.tags.some(function(tag) {
                               return tag.includes(currentCategory);
                           });
                });
            }

            if (currentSearch) {
                filtered = filtered.filter(function(account) {
                    return account.username.toLowerCase().includes(currentSearch.toLowerCase()) ||
                           account.displayName.toLowerCase().includes(currentSearch.toLowerCase()) ||
                           account.tags.some(function(tag) {
                               return tag.toLowerCase().includes(currentSearch.toLowerCase());
                           });
                });
            }

            return filtered;
        }

        function renderAccounts() {
            var filteredAccounts = filterAccounts();
            var accountsGrid = document.getElementById('accountsGrid');
            var emptyState = document.getElementById('emptyState');

            if (filteredAccounts.length === 0) {
                accountsGrid.innerHTML = '';
                emptyState.style.display = 'block';
            } else {
                accountsGrid.innerHTML = filteredAccounts.map(renderAccountCard).join('');
                emptyState.style.display = 'none';
            }
        }

        function followAccount(accountId) {
            var account = accounts.find(function(acc) {
                return acc.id === accountId;
            });
            alert('关注账号: @' + account.username);
        }

        document.addEventListener('DOMContentLoaded', function() {
            var categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    categoryBtns.forEach(function(b) {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    currentCategory = this.dataset.category;
                    renderAccounts();
                });
            });

            var searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                currentSearch = this.value;
                renderAccounts();
            });

            renderAccounts();
        });
    </script>
