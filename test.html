<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFinX 测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #F2F2F7;
            color: #1C1C1E;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo {
            width: 60px;
            height: 60px;
            background: #0A84FF;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo span {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            margin: 0 0 20px 0;
            color: #1C1C1E;
        }
        .subtitle {
            font-size: 20px;
            color: #8A8A8E;
            margin-bottom: 40px;
        }
        .status {
            background: #34C759;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span>T</span>
            </div>
            <h1>TechFinX</h1>
            <p class="subtitle">金融科技账号聚合站</p>
            <div class="status">✅ 网站运行正常</div>
        </div>
        
        <div style="text-align: center; margin-top: 40px;">
            <p>如果您看到这个页面，说明网站基础功能正常。</p>
            <p>React应用正在加载中...</p>
        </div>
    </div>
</body>
</html>
